<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>watchf1.live | Live Stream Party Selection</title>
    
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 3D Library for Premium Visualizer Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <style>
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(10, 10, 10, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-white: #ffffff;
            --text-gray: #8e8e93;
            --f1-red: #e60000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 3D Vanta Visualizer Background Container */
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            #vanta-bg {
                display: none !important;
            }
        }

        /* Ambient blur spots */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.1;
            pointer-events: none;
            transition: all 0.8s ease;
        }

        .ambient-red {
            background: var(--f1-red);
            top: -200px;
            left: -150px;
            animation: float-red 25s infinite alternate ease-in-out;
        }

        @keyframes float-red {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, 80px) scale(1.15); }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 24px;
            text-align: center;
            z-index: 10;
        }

        header {
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease forwards;
        }

        .logo {
            font-family: 'Titillium Web', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 40%, #a0a0a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--f1-red), #ff4d4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            color: var(--f1-red);
            -webkit-text-fill-color: var(--f1-red);
        }

        .tagline {
            font-size: 1.15rem;
            color: var(--text-gray);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
            letter-spacing: 0.5px;
        }

        /* Cards Layout */
        .cards-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .sport-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
            width: 100%;
            max-width: 420px;
        }

        .sport-card {
            animation-delay: 0.2s;
            --card-glow: var(--f1-red);
            --card-glow-alpha: rgba(230, 0, 0, 0.12);
            --btn-bg: var(--f1-red);
            --btn-hover: #ff1a1a;
            --btn-text: #ffffff;
        }

        .sport-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.025), transparent 70%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .sport-card:hover {
            transform: translateY(-10px);
            border-color: var(--card-glow);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 40px var(--card-glow-alpha);
        }

        .sport-card:hover::before {
            opacity: 0.5;
        }

        /* Icon setup */
        .icon-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: var(--card-glow);
            margin-bottom: 28px;
            position: relative;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sport-card:hover .icon-circle {
            background: var(--card-glow-alpha);
            border-color: var(--card-glow);
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 20px var(--card-glow-alpha);
        }

        /* Text styling */
        .sport-title {
            font-family: 'Titillium Web', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff, #e0e0e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sport-desc {
            font-size: 0.95rem;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 280px;
            min-height: 45px;
        }

        /* Action Buttons */
        .enter-btn {
            width: 100%;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .sport-card:hover .enter-btn {
            background: var(--btn-hover);
            transform: scale(1.02);
            box-shadow: 0 8px 25px var(--card-glow-alpha);
        }

        .enter-btn i {
            transition: transform 0.3s ease;
        }

        .sport-card:hover .enter-btn i {
            transform: translateX(5px);
        }

        /* Footer styling */
        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.6s;
            opacity: 0;
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Responsive adaptations */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            .sport-card {
                padding: 35px 25px;
            }
        }

        /* Interactive transitions */
        body.transitioning-f1 {
            background-color: #0a0000;
            transition: background-color 0.6s ease;
        }

        body.transitioning-f1 #vanta-bg {
            opacity: 0.85 !important;
            transition: opacity 0.6s ease;
        }

        .container {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Mobile-app optimizations and Native look & feel */
        ::-webkit-scrollbar {
            display: none !important;
        }
        * {
            scrollbar-width: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            user-select: none !important;
            -webkit-user-select: none;
            touch-action: pan-y;
            overscroll-behavior-y: contain;
        }
    </style>
</head>

<body class="page-home">

    <div id="vanta-bg"></div>
    <div class="ambient-glow ambient-red"></div>
    <div class="grid-overlay"></div>

    <div class="container">
        <header>
            <h1 class="logo">
                <i class="fa-solid fa-play"></i>watchf1<span>.live</span>
            </h1>
            <p class="tagline">Connect with fans. Enjoy high-performance Formula 1 streaming in real-time.</p>
        </header>

        <main class="cards-wrapper">
            <!-- Formula 1 Card -->
            <a href="f1.html" class="sport-card" id="card-f1" onclick="navigateTo(event, 'f1.html', '/f1')">
                <div class="icon-circle" style="border-radius: 20px; width: 110px; height: 110px; overflow: hidden; background: transparent; border: 1px solid rgba(255, 255, 255, 0.08);">
                    <img src="f1-logo.png" alt="Formula 1 Logo" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h2 class="sport-title">Formula 1</h2>
                <p class="sport-desc">Live GP race streams, weekend session schedules, and championship standings.</p>

                <button class="enter-btn">
                    Enter Party <i class="fa-solid fa-arrow-right"></i>
                </button>
            </a>
        </main>

        <footer>
            <p style="font-size: 0.75rem; opacity: 0.6; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.5;">
                This website does not create, host, or share any video content. All video streams are external web links.
            </p>
        </footer>
    </div>

    <script>
        // Check if running locally or production to handle direct URL routing
        function navigateTo(event, localHtml, prodRoute) {
            event.preventDefault();
            
            const isLocal = window.location.protocol === 'file:' || 
                            window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' ||
                            window.location.hostname === 'appassets.androidplatform.net';
            let destination = isLocal ? localHtml : prodRoute;

            // Apply transition styles
            document.body.classList.add('transitioning-f1');
            
            // Scale and fade out container elements
            const container = document.querySelector('.container');
            if (container) {
                container.style.opacity = '0';
                container.style.transform = 'scale(0.96)';
            }
            
            setTimeout(() => {
                window.location.href = destination;
            }, 600);
        }

        // Vanta Net Background Manager (initialized on desktop, completely disabled on mobile/tablets for performance)
        const isMobileDevice = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                             ('ontouchstart' in window) || 
                             (navigator.maxTouchPoints > 0);

        function initVanta() {
            if (typeof VANTA !== 'undefined' && !isMobileDevice && window.innerWidth > 768 && !window.vantaInstance) {
                try {
                    window.vantaInstance = VANTA.NET({
                        el: "#vanta-bg",
                        mouseControls: true,
                        touchControls: false,
                        gyroControls: false,
                        minHeight: 200.00,
                        minWidth: 200.00,
                        scale: 1.00,
                        scaleMobile: 1.00,
                        color: 0x222222,
                        backgroundColor: 0x050505,
                        points: 12.00,
                        maxDistance: 20.00,
                        spacing: 16.00
                    });
                } catch (e) {
                    console.error("Vanta initialization failed: ", e);
                }
            }
        }

        // Initialize on DOM load
        document.addEventListener("DOMContentLoaded", function () {
            initVanta();
        });

        // Bind interactive mouseenter / mouseleave triggers to F1 card for dynamic transitions
        document.addEventListener('DOMContentLoaded', () => {
            const cardF1 = document.getElementById('card-f1');
            const ambientRed = document.querySelector('.ambient-red');

            if (cardF1) {
                cardF1.addEventListener('mouseenter', () => {
                    if (ambientRed) {
                        ambientRed.style.opacity = '0.35';
                        ambientRed.style.transform = 'scale(1.25)';
                    }
                });

                cardF1.addEventListener('mouseleave', () => {
                    if (ambientRed) {
                        ambientRed.style.opacity = '0.1';
                        ambientRed.style.transform = 'none';
                    }
                });
            }
        });
    </script>
</body>

</html>
