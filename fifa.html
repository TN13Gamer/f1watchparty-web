<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>watchfifa.live — Live Football Streaming</title>
  <meta name="description" content="Watch FIFA World Cup 2026 live. Free HD football streaming with multiple broadcast sources and auto-failover.">
  <meta name="theme-color" content="#05060f">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

  <!-- Lottie -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js" crossorigin="anonymous"></script>

  <style>
    /* ═══════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════ */
    :root {
      --bg:           #05060f;
      --surface:      #0b0e1a;
      --elevated:     #10141f;
      --border:       rgba(255,255,255,0.06);
      --border-hi:    rgba(255,255,255,0.11);
      --border-green: rgba(0,224,84,0.28);
      --green:        #00e054;
      --green-dim:    rgba(0,224,84,0.10);
      --green-glow:   rgba(0,224,84,0.20);
      --red:          #f02060;
      --red-dim:      rgba(240,32,96,0.12);
      --text:         #eef0f8;
      --text-dim:     #8492b4;
      --text-muted:   #4b5880;
      --nav-h:        64px;
      --r-sm:         6px;
      --r-md:         12px;
      --r-lg:         18px;
      --r-xl:         24px;
      --ease:         cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ═══════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.07) transparent; }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; }

    /* Subtle ambient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 35% at 50% -5%, rgba(0,224,84,0.055) 0%, transparent 65%),
        radial-gradient(ellipse 45% 30% at 90% 110%, rgba(0,80,255,0.04) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════
       FULLSCREEN LOADER
    ═══════════════════════════════════════ */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s var(--ease), visibility 0.7s;
    }
    #loader.out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #lottie-wrap { width: 210px; height: 210px; }
    .loader-text {
      margin-top: 18px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: txt-breathe 2.2s ease-in-out infinite;
    }
    @keyframes txt-breathe {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.9; }
    }

    /* ═══════════════════════════════════════
       NAVIGATION BAR
    ═══════════════════════════════════════ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(5,6,15,0.88);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-bottom: 1px solid var(--border);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      gap: 16px;
    }

    /* Brand */
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 var(--green-glow);
      animation: dot-pulse 2.2s ease infinite;
      flex-shrink: 0;
    }
    @keyframes dot-pulse {
      0%   { box-shadow: 0 0 0 0 var(--green-glow); }
      65%  { box-shadow: 0 0 0 8px rgba(0,224,84,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,224,84,0); }
    }
    .brand-wordmark {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .brand-wordmark em {
      color: var(--green);
      font-style: normal;
    }

    /* Pill tabs */
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 4px;
    }
    .nav-tab {
      padding: 7px 20px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--text-dim);
      transition: all 0.2s var(--ease);
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .nav-tab i { font-size: 0.75rem; }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      background: var(--green);
      color: #020c05;
    }

    /* Nav actions */
    .nav-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-md);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.85rem;
      transition: all 0.2s var(--ease);
    }
    .nav-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    /* ═══════════════════════════════════════
       PAGE WRAPPER
    ═══════════════════════════════════════ */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1840px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 20px) 24px 64px;
    }

    /* ═══════════════════════════════════════
       HERO GRID  (player 75% | sidebar 25%)
    ═══════════════════════════════════════ */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 288px;
      gap: 18px;
      align-items: start;
    }

    /* ── LEFT: Player Column ── */
    .player-col { display: flex; flex-direction: column; gap: 12px; }

    .player-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--r-lg);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0,0,0,0.65);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .player-frame:hover {
      border-color: var(--border-green);
      box-shadow: 0 24px 64px rgba(0,0,0,0.65), 0 0 0 1px var(--border-green);
    }

    #stream-iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* Player overlay – visible on hover */
    .player-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(5,6,15,0.9) 0%,
        rgba(5,6,15,0.2) 35%,
        transparent 55%
      );
      opacity: 0;
      transition: opacity 0.28s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px;
      z-index: 10;
      pointer-events: none;
    }
    .player-frame:hover .player-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .ov-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ov-bottom {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--red);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 4px;
    }
    .badge-live-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      animation: li-blink 1.1s ease infinite;
    }
    @keyframes li-blink {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 1; }
    }

    .signal-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.58);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 4px 11px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--green);
    }
    .signal-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    .ctrl {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-sm);
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-size: 0.88rem;
      transition: all 0.2s var(--ease);
    }
    .ctrl:hover {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
      transform: scale(1.06);
    }

    /* ── SOURCE BAR ── */
    .source-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px;
      flex-wrap: wrap;
    }
    .source-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .source-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }
    .src-btn {
      padding: 5px 13px;
      border-radius: 100px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 700;
      transition: all 0.18s var(--ease);
      white-space: nowrap;
    }
    .src-btn:hover { border-color: var(--border-hi); color: var(--text); }
    .src-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #020c05;
    }
    .src-btn .qtag {
      font-size: 0.62rem;
      opacity: 0.7;
      margin-left: 3px;
      font-weight: 600;
    }

    .failover-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 100px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.76rem;
      font-weight: 700;
      margin-left: auto;
      transition: all 0.18s var(--ease);
      white-space: nowrap;
    }
    .failover-btn:hover { border-color: var(--red); color: var(--red); }
    .failover-btn i { font-size: 0.72rem; }

    /* ── RIGHT: Match Sidebar ── */
    .match-sidebar {
      position: sticky;
      top: calc(var(--nav-h) + 16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Match Info Card */
    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .match-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 15px;
      background: var(--elevated);
      border-bottom: 1px solid var(--border);
    }
    .comp-name {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--green);
    }

    .status-tag {
      font-size: 0.67rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 3px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .status-tag.live     { background: var(--red-dim); color: var(--red); border: 1px solid rgba(240,32,96,0.22); }
    .status-tag.upcoming { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }
    .status-tag.finished { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border); }

    /* Scoreboard */
    .scoreboard {
      padding: 18px 14px 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }
    .team-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }
    .team-flag {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.08);
      background: var(--elevated);
    }
    .team-name-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1.2;
      max-width: 95px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .score-nums {
      display: flex;
      align-items: baseline;
      gap: 1px;
    }
    .score-n {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -3px;
      color: var(--text);
      line-height: 1;
    }
    .score-sep {
      font-size: 1.6rem;
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1;
      margin: 0 3px;
      letter-spacing: 0;
    }
    .score-info {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .match-card-foot {
      padding: 10px 15px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .foot-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.74rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .foot-row i {
      color: var(--text-muted);
      font-size: 0.7rem;
      width: 12px;
      text-align: center;
    }
    .foot-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Next Match mini card */
    .next-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
    }
    .next-card-label {
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }
    .next-card-match {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .next-card-time {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--green);
    }

    /* ═══════════════════════════════════════
       FIXTURES SECTION
    ═══════════════════════════════════════ */
    .section { margin-top: 30px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title i { color: var(--green); font-size: 0.85rem; }

    .tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px;
      gap: 2px;
    }
    .tab {
      padding: 5px 14px;
      border-radius: 100px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: all 0.18s var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--green); color: #020c05; }

    /* Horizontal scroll track */
    .fx-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    /* Individual fixture card */
    .fx-card {
      min-width: 215px;
      width: 215px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex-shrink: 0;
      scroll-snap-align: start;
      cursor: pointer;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    }
    .fx-card:hover {
      border-color: var(--border-hi);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .fx-card.is-live {
      border-color: rgba(240,32,96,0.22);
      background: rgba(240,32,96,0.035);
    }
    .fx-card.is-current {
      border-color: var(--border-green);
      background: var(--green-dim);
    }

    .fx-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .fx-round {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 120px;
    }
    .fx-live-tag {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--red);
      background: var(--red-dim);
      border: 1px solid rgba(240,32,96,0.18);
      border-radius: 3px;
      padding: 2px 6px;
    }
    .fx-time {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .fx-teams { display: flex; flex-direction: column; gap: 5px; }
    .fx-team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .fx-team-name {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .fx-score {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text);
      min-width: 14px;
      text-align: right;
    }
    .fx-divider { height: 1px; background: var(--border); margin: 1px 0; }

    .fx-foot {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .fx-foot i { font-size: 0.58rem; }

    .fx-empty {
      display: flex; align-items: center; justify-content: center;
      min-height: 90px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      flex: 1;
    }

    /* ═══════════════════════════════════════
       STANDINGS — COLLAPSIBLE
    ═══════════════════════════════════════ */
    .standings-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .standings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .standings-head:hover { background: rgba(255,255,255,0.02); }
    .standings-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.93rem;
      font-weight: 800;
    }
    .standings-head-left i { color: var(--green); font-size: 0.85rem; }
    .chevron {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: transform 0.28s var(--ease);
    }
    .standings-wrap.open .chevron { transform: rotate(180deg); }

    .standings-body {
      display: none;
      padding: 0 18px 18px;
      flex-direction: column;
      gap: 12px;
    }
    .standings-wrap.open .standings-body { display: flex; }

    .group-pills {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding-top: 2px;
    }
    .grp-pill {
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .grp-pill:hover { color: var(--text); border-color: var(--border-hi); }
    .grp-pill.active { background: var(--green); border-color: var(--green); color: #020c05; }

    .st-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .st-table th {
      padding: 6px 7px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid var(--border);
    }
    .st-table th.left { text-align: left; padding-left: 0; }
    .st-table td {
      padding: 7px 7px;
      text-align: center;
      color: var(--text-dim);
      font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,0.025);
    }
    .st-table tr:last-child td { border-bottom: none; }
    .st-table .td-pos { color: var(--text-muted); font-size: 0.73rem; width: 22px; }
    .st-table .td-team { text-align: left; padding-left: 0; color: var(--text); font-weight: 700; white-space: nowrap; }
    .st-table .td-pts { color: var(--text); font-weight: 800; }
    .q-bar { display: inline-block; width: 3px; height: 13px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    .q-bar.up { background: var(--green); }
    .q-bar.dn { background: var(--red); }

    /* ═══════════════════════════════════════
       MOBILE MINI PLAYER (sticky)
    ═══════════════════════════════════════ */
    .mini-player {
      display: none; /* shown only on mobile via media query */
      position: fixed;
      top: var(--nav-h);
      left: 0;
      right: 0;
      height: 58px;
      background: rgba(5,6,15,0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 499;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      transform: translateY(-120%);
      transition: transform 0.32s var(--ease);
    }
    .mini-player.show { transform: translateY(0); }

    .mini-thumb {
      width: 82px; height: 46px;
      border-radius: var(--r-sm);
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .mini-thumb iframe { width: 100%; height: 100%; border: none; pointer-events: none; }

    .mini-info { flex: 1; overflow: hidden; }
    .mini-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mini-score {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--green);
      margin-top: 2px;
    }

    .mini-back {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-sm);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       SCORE FLASH ANIMATION
    ═══════════════════════════════════════ */
    @keyframes score-flash {
      0%   { color: var(--green); text-shadow: 0 0 14px var(--green); }
      100% { color: var(--text); text-shadow: none; }
    }
    .score-n.flashed { animation: score-flash 1.8s var(--ease); }

    /* ═══════════════════════════════════════
       RESPONSIVE BREAKPOINTS
    ═══════════════════════════════════════ */

    /* Tablet */
    @media (max-width: 1100px) {
      .hero-grid {
        grid-template-columns: 1fr 260px;
        gap: 14px;
      }
    }

    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; }
      .match-sidebar {
        position: static;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .match-card { grid-column: 1 / -1; }
    }

    /* Mobile */
    @media (max-width: 768px) {
      :root { --nav-h: 56px; }
      .nav { padding: 0 14px; }
      .brand-wordmark { font-size: 1.1rem; }
      .nav-tabs { display: none; }

      .page { padding-left: 12px; padding-right: 12px; }

      .match-sidebar { grid-template-columns: 1fr; }
      .next-card { display: none; }

      .mini-player { display: flex; }

      .source-label { display: none; }
      .source-bar { gap: 7px; }

      /* Standings collapsed on mobile */
      .standings-wrap.open { /* unchanged — user controls it */ }

      .section { margin-top: 22px; }
      .fx-card { min-width: 190px; width: 190px; }
    }

    @media (max-width: 480px) {
      .nav-btn { display: none; }
      .fx-card { min-width: 175px; width: 175px; }
      .page { padding-left: 10px; padding-right: 10px; }
    }

    @media (max-width: 360px) {
      .fx-card { min-width: 162px; width: 162px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════
     LOADER
════════════════════════════════ -->
<div id="loader">
  <div id="lottie-wrap"></div>
  <div class="loader-text">Loading watchfifa.live</div>
</div>

<!-- ════════════════════════════════
     MINI PLAYER (Mobile sticky)
════════════════════════════════ -->
<div class="mini-player" id="mini-player">
  <div class="mini-thumb">
    <iframe id="mini-iframe" src="" allow="autoplay" scrolling="no"></iframe>
  </div>
  <div class="mini-info">
    <div class="mini-name" id="mini-name">Loading match...</div>
    <div class="mini-score" id="mini-score">—</div>
  </div>
  <button class="mini-back" id="mini-back" title="Scroll to stream">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</div>

<!-- ════════════════════════════════
     NAVIGATION
════════════════════════════════ -->
<nav class="nav" role="navigation" aria-label="Main navigation">
  <a href="/fifa" class="nav-brand" aria-label="watchfifa.live home">
    <div class="live-dot" aria-hidden="true"></div>
    <span class="brand-wordmark">watchfifa<em>.live</em></span>
  </a>

  <div class="nav-tabs">
    <a href="/f1" class="nav-tab">
      <i class="fa-solid fa-flag-checkered" aria-hidden="true"></i>F1 Party
    </a>
    <a href="/fifa" class="nav-tab active" aria-current="page">
      <i class="fa-solid fa-futbol" aria-hidden="true"></i>FIFA Party
    </a>
  </div>

  <div class="nav-actions">
    <button class="nav-btn" id="btn-search" aria-label="Search">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    </button>
  </div>
</nav>

<!-- ════════════════════════════════
     MAIN PAGE
════════════════════════════════ -->
<div class="page">

  <!-- ── HERO: PLAYER + SIDEBAR ── -->
  <section class="hero-grid" aria-label="Live stream">

    <!-- Left: Player -->
    <div class="player-col">

      <!-- Stream Frame -->
      <div class="player-frame" id="player-frame">
        <iframe
          id="stream-iframe"
          src=""
          allowfullscreen
          scrolling="no"
          allow="autoplay; encrypted-media; picture-in-picture"
          title="Live match stream"
        ></iframe>

        <!-- Hover Overlay -->
        <div class="player-overlay" aria-hidden="true">
          <div class="ov-top">
            <div class="badge-live" id="badge-live" style="display:none;" aria-label="Live">
              <div class="badge-live-dot"></div>LIVE
            </div>
            <div class="signal-pill" id="signal-pill">
              <div class="signal-dot"></div>
              <span>Good Signal</span>
            </div>
          </div>
          <div class="ov-bottom">
            <button class="ctrl" id="ctrl-theater" title="Theater mode">
              <i class="fa-solid fa-rectangle-wide" aria-hidden="true"></i>
            </button>
            <button class="ctrl" id="ctrl-fullscreen" title="Fullscreen">
              <i class="fa-solid fa-expand" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Source Bar -->
      <div class="source-bar" id="source-bar" aria-label="Stream sources">
        <span class="source-label">Feed</span>
        <div class="source-list" id="source-list">
          <span style="font-size:0.78rem;color:var(--text-muted);">Fetching streams...</span>
        </div>
        <button class="failover-btn" id="btn-failover" aria-label="Auto switch feed">
          <i class="fa-solid fa-rotate" aria-hidden="true"></i>Auto Switch
        </button>
      </div>

    </div>

    <!-- Right: Match Sidebar -->
    <div class="match-sidebar" id="match-sidebar">

      <!-- Current match card -->
      <div class="match-card" id="match-card">
        <div class="match-card-head">
          <span class="comp-name" id="mc-comp">FIFA World Cup 2026</span>
          <span class="status-tag upcoming" id="mc-status">—</span>
        </div>

        <div class="scoreboard">
          <div class="team-col">
            <img class="team-flag" id="mc-home-flag"
              src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACAA=="
              alt="Home team">
            <span class="team-name-text" id="mc-home-name">Home</span>
          </div>

          <div class="score-col">
            <div class="score-nums">
              <span class="score-n" id="mc-hs">—</span>
              <span class="score-sep">:</span>
              <span class="score-n" id="mc-as">—</span>
            </div>
            <span class="score-info" id="mc-time-lbl">—</span>
          </div>

          <div class="team-col">
            <img class="team-flag" id="mc-away-flag"
              src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACAA=="
              alt="Away team">
            <span class="team-name-text" id="mc-away-name">Away</span>
          </div>
        </div>

        <div class="match-card-foot">
          <div class="foot-row">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <span id="mc-stadium">—</span>
          </div>
          <div class="foot-row">
            <i class="fa-solid fa-calendar-alt" aria-hidden="true"></i>
            <span id="mc-date">—</span>
          </div>
        </div>
      </div>

      <!-- Next match card -->
      <div class="next-card" id="next-card" style="display:none;" aria-label="Next match">
        <div class="next-card-label">Next Match</div>
        <div class="next-card-match" id="next-name">—</div>
        <div class="next-card-time" id="next-time">—</div>
      </div>

    </div>
  </section>

  <!-- ── FIXTURES ── -->
  <section class="section" aria-label="Fixtures">
    <div class="section-head">
      <h2 class="section-title">
        <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
        Fixtures
      </h2>
      <div class="tabs" id="fx-tabs" role="tablist">
        <button class="tab active" data-tab="live" role="tab" aria-selected="true">Live</button>
        <button class="tab" data-tab="upcoming" role="tab" aria-selected="false">Upcoming</button>
        <button class="tab" data-tab="finished" role="tab" aria-selected="false">Finished</button>
      </div>
    </div>
    <div class="fx-track" id="fx-track" role="list">
      <div class="fx-empty">Loading fixtures...</div>
    </div>
  </section>

  <!-- ── STANDINGS ── -->
  <section class="section" aria-label="Group standings">
    <div class="standings-wrap open" id="standings-wrap">
      <div class="standings-head" id="standings-toggle" role="button" aria-expanded="true" tabindex="0">
        <div class="standings-head-left">
          <i class="fa-solid fa-table-list" aria-hidden="true"></i>
          Group Standings
        </div>
        <i class="fa-solid fa-chevron-down chevron" aria-hidden="true"></i>
      </div>
      <div class="standings-body" id="standings-body">
        <div class="group-pills" id="group-pills"></div>
        <div style="overflow-x:auto;">
          <table class="st-table" aria-label="Standings table">
            <thead>
              <tr>
                <th class="left" style="width:22px;">#</th>
                <th class="left">Team</th>
                <th title="Matches Played">MP</th>
                <th title="Won">W</th>
                <th title="Drawn">D</th>
                <th title="Lost">L</th>
                <th title="Goal Difference">GD</th>
                <th title="Points" style="color:var(--text);">Pts</th>
              </tr>
            </thead>
            <tbody id="st-rows">
              <tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:18px;font-size:0.8rem;">Loading standings...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

</div><!-- .page -->

<!-- ════════════════════════════════
     APP SCRIPT
════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ── Config ── */
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const API     = isLocal ? 'http://localhost:3000' : '';

  /* ── App State ── */
  const S = {
    streams:      [],
    sourceIdx:    0,
    raceData:     null,
    fixtures:     [],
    standings:    {},
    activeTab:    'live',
    activeGroup:  null,
    prevHS:       null,
    prevAS:       null,
    loaderDone:   false,
  };

  /* ══════════════════════════
     LOADER
  ══════════════════════════ */
  const loaderEl = document.getElementById('loader');

  lottie.loadAnimation({
    container:  document.getElementById('lottie-wrap'),
    renderer:   'svg',
    loop:       true,
    autoplay:   true,
    path:       'scene.json'
  });

  function hideLoader() {
    if (S.loaderDone) return;
    S.loaderDone = true;
    loaderEl.classList.add('out');
  }
  setTimeout(hideLoader, 4500); // max wait

  /* ══════════════════════════
     PLAYER CONTROLS
  ══════════════════════════ */
  const playerFrame  = document.getElementById('player-frame');
  const streamIframe = document.getElementById('stream-iframe');
  const miniIframe   = document.getElementById('mini-iframe');

  /* Theater mode */
  document.getElementById('ctrl-theater').addEventListener('click', () => {
    playerFrame.classList.toggle('theater');
    const icon = document.querySelector('#ctrl-theater i');
    icon.className = playerFrame.classList.contains('theater')
      ? 'fa-solid fa-compress-wide'
      : 'fa-solid fa-rectangle-wide';
  });

  /* Fullscreen */
  document.getElementById('ctrl-fullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      playerFrame.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    const icon = document.querySelector('#ctrl-fullscreen i');
    icon.className = document.fullscreenElement ? 'fa-solid fa-compress' : 'fa-solid fa-expand';
  });

  /* Auto-failover */
  document.getElementById('btn-failover').addEventListener('click', () => {
    if (S.streams.length > 1) {
      S.sourceIdx = (S.sourceIdx + 1) % S.streams.length;
      activateSource(S.sourceIdx);
    }
  });

  /* ══════════════════════════
     SOURCES
  ══════════════════════════ */
  const QUALITY_HINTS = ['HD', '', 'Backup', 'Alt', 'Ultra', '', '', ''];

  function activateSource(idx) {
    const link = S.streams[idx];
    if (!link?.url) return;
    S.sourceIdx = idx;

    streamIframe.src = link.url;
    miniIframe.src   = link.url;

    document.querySelectorAll('.src-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === idx);
    });
  }

  function renderSources() {
    const container = document.getElementById('source-list');
    if (!S.streams.length) {
      container.innerHTML = '<span style="font-size:0.78rem;color:var(--text-muted);">No feeds available</span>';
      return;
    }
    container.innerHTML = S.streams.map((_, i) => {
      const hint = QUALITY_HINTS[i] || '';
      return `<button class="src-btn${i === S.sourceIdx ? ' active' : ''}" data-i="${i}">
        Source ${i + 1}${hint ? `<span class="qtag">${hint}</span>` : ''}
      </button>`;
    }).join('');

    container.querySelectorAll('.src-btn').forEach(btn => {
      btn.addEventListener('click', () => activateSource(+btn.dataset.i));
    });
  }

  /* ══════════════════════════
     MATCH CARD
  ══════════════════════════ */
  function updateMatchCard(data) {
    if (!data) return;
    S.raceData = data;

    const homeName = (data.name || '').split(' vs ')[0]?.trim() || 'Home';
    const awayName = (data.name || '').split(' vs ')[1]?.trim() || 'Away';
    const hs = data.homeScore ?? '—';
    const as = data.awayScore ?? '—';

    document.getElementById('mc-comp').textContent   = data.round || 'FIFA World Cup 2026';
    document.getElementById('mc-home-name').textContent = homeName;
    document.getElementById('mc-away-name').textContent = awayName;
    document.getElementById('mc-stadium').textContent = data.circuit || data.location || '—';
    document.getElementById('mc-date').textContent    = data.date || '—';

    const hsEl = document.getElementById('mc-hs');
    const asEl = document.getElementById('mc-as');

    /* Flash on score change */
    if (S.prevHS !== null && S.prevHS !== hs) flashEl(hsEl);
    if (S.prevAS !== null && S.prevAS !== as) flashEl(asEl);
    S.prevHS = hs; S.prevAS = as;

    hsEl.textContent = hs;
    asEl.textContent = as;

    const statusEl  = document.getElementById('mc-status');
    const badgeLive = document.getElementById('badge-live');
    const timeLbl   = document.getElementById('mc-time-lbl');

    if (data.isLive) {
      statusEl.textContent  = data.matchTime ? `${data.matchTime}'` : 'LIVE';
      statusEl.className    = 'status-tag live';
      timeLbl.textContent   = data.matchTime ? `${data.matchTime}'` : 'LIVE';
      badgeLive.style.display = 'inline-flex';
    } else if (data.isFinished) {
      statusEl.textContent  = 'FT';
      statusEl.className    = 'status-tag finished';
      timeLbl.textContent   = 'Full Time';
      badgeLive.style.display = 'none';
    } else {
      statusEl.textContent  = 'Upcoming';
      statusEl.className    = 'status-tag upcoming';
      timeLbl.textContent   = data.date || 'Scheduled';
      badgeLive.style.display = 'none';
    }

    /* Mini player info */
    document.getElementById('mini-name').textContent  = data.name || 'Live Match';
    document.getElementById('mini-score').textContent = (data.isLive || data.isFinished)
      ? `${hs} — ${as}`
      : 'Upcoming';
  }

  function flashEl(el) {
    el.classList.remove('flashed');
    void el.offsetWidth; // reflow
    el.classList.add('flashed');
  }

  /* ══════════════════════════
     FETCH: LIVE CONFIG
  ══════════════════════════ */
  async function fetchConfig() {
    try {
      const r   = await fetch(`${API}/api/live-config`);
      if (!r.ok) throw new Error(r.status);
      const cfg = await r.json();

      if (cfg.fifa) {
        const { raceData, streamLinks } = cfg.fifa;
        if (raceData) updateMatchCard(raceData);

        if (Array.isArray(streamLinks) && streamLinks.length) {
          S.streams = streamLinks;
          renderSources();
          activateSource(0);
        }
      }
    } catch (e) {
      console.warn('[config]', e.message);
      // Fallback: fetch streams directly
      fetchStreams();
    } finally {
      hideLoader();
    }
  }

  async function fetchStreams() {
    try {
      const r = await fetch(`${API}/api/fifa/streams`);
      if (!r.ok) return;
      const d = await r.json();
      if (d.streamLinks?.length) {
        S.streams = d.streamLinks;
        renderSources();
        if (!streamIframe.src || streamIframe.src === location.href) activateSource(0);
      }
    } catch (e) {
      console.warn('[streams]', e.message);
    }
  }

  /* ══════════════════════════
     FETCH: FIXTURES
  ══════════════════════════ */
  async function fetchFixtures() {
    try {
      const r = await fetch(`${API}/api/fifa/fixtures`);
      if (!r.ok) return;
      const d = await r.json();
      if (Array.isArray(d)) {
        S.fixtures = d;
        renderFixtures();
        updateNextCard();
      }
    } catch (e) { console.warn('[fixtures]', e.message); }
  }

  function updateNextCard() {
    const upcoming = S.fixtures
      .filter(f => f.status === 'notstarted' && !f.finished)
      .sort((a, b) => (a.kickoffTs || 0) - (b.kickoffTs || 0));

    const card = document.getElementById('next-card');
    if (upcoming.length) {
      const nx = upcoming[0];
      document.getElementById('next-name').textContent = `${nx.homeTeam} vs ${nx.awayTeam}`;
      document.getElementById('next-time').textContent = nx.localDate || '—';
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  }

  /* Fixture Tabs */
  document.getElementById('fx-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('#fx-tabs .tab').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    S.activeTab = btn.dataset.tab;
    renderFixtures();
  });

  function renderFixtures() {
    const track = document.getElementById('fx-track');

    const filtered = S.fixtures.filter(f => {
      if (S.activeTab === 'live')     return f.status === 'inprogress' || f.status === 'live';
      if (S.activeTab === 'upcoming') return f.status === 'notstarted' && !f.finished;
      return f.finished || f.status === 'finished';
    });

    if (!filtered.length) {
      track.innerHTML = `<div class="fx-empty">No ${S.activeTab} matches</div>`;
      return;
    }

    const currentName = S.raceData?.name || '';

    track.innerHTML = filtered.map(f => {
      const isLive  = f.status === 'inprogress' || f.status === 'live';
      const hasScore = isLive || f.finished;
      const isCurrent = currentName && `${f.homeTeam} vs ${f.awayTeam}` === currentName;

      const timeDisplay = isLive
        ? (f.matchTime ? `${f.matchTime}'` : 'LIVE')
        : (f.finished ? 'FT' : (f.localDate || '—'));

      return `<div class="fx-card${isLive ? ' is-live' : ''}${isCurrent ? ' is-current' : ''}" data-id="${f.id}" role="listitem">
        <div class="fx-top">
          <span class="fx-round">${f.round || 'Group Stage'}</span>
          ${isLive
            ? `<span class="fx-live-tag">● ${f.matchTime ? f.matchTime + "'" : 'LIVE'}</span>`
            : `<span class="fx-time">${timeDisplay}</span>`}
        </div>
        <div class="fx-teams">
          <div class="fx-team-row">
            <span class="fx-team-name">${escHtml(f.homeTeam || '—')}</span>
            ${hasScore ? `<span class="fx-score">${f.homeScore ?? '0'}</span>` : ''}
          </div>
          <div class="fx-divider"></div>
          <div class="fx-team-row">
            <span class="fx-team-name">${escHtml(f.awayTeam || '—')}</span>
            ${hasScore ? `<span class="fx-score">${f.awayScore ?? '0'}</span>` : ''}
          </div>
        </div>
        <div class="fx-foot">
          <i class="fa-solid fa-location-dot"></i>
          ${escHtml(f.stadium || 'FIFA Venue')}
        </div>
      </div>`;
    }).join('');
  }

  /* ══════════════════════════
     FETCH: STANDINGS
  ══════════════════════════ */
  async function fetchStandings() {
    try {
      const r = await fetch(`${API}/api/fifa/standings`);
      if (!r.ok) return;
      const d = await r.json();
      if (d?.groups && Object.keys(d.groups).length) {
        S.standings = d.groups;
        renderGroupPills();
        const firstKey = Object.keys(d.groups)[0];
        S.activeGroup = firstKey;
        renderStandingsTable(d.groups[firstKey]);
      }
    } catch (e) { console.warn('[standings]', e.message); }
  }

  function renderGroupPills() {
    const container = document.getElementById('group-pills');
    const keys = Object.keys(S.standings);
    container.innerHTML = keys.map((g, i) =>
      `<button class="grp-pill${i === 0 ? ' active' : ''}" data-g="${g}">${g}</button>`
    ).join('');
    container.querySelectorAll('.grp-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.grp-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        S.activeGroup = btn.dataset.g;
        renderStandingsTable(S.standings[S.activeGroup]);
      });
    });
  }

  function renderStandingsTable(teams) {
    const tbody = document.getElementById('st-rows');
    if (!teams?.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:14px;font-size:0.78rem;">No data</td></tr>`;
      return;
    }
    tbody.innerHTML = teams.map((t, i) => {
      const bar = i < 2
        ? `<span class="q-bar up"></span>`
        : (i >= teams.length - 1 ? `<span class="q-bar dn"></span>` : '');
      const name = t.name || t.team || '—';
      const mp   = t.mp   ?? t.played ?? '—';
      const w    = t.w    ?? t.won    ?? '—';
      const d    = t.d    ?? t.drawn  ?? '—';
      const l    = t.l    ?? t.lost   ?? '—';
      const gd   = t.gd   ?? ((t.gf || 0) - (t.ga || 0)) || '—';
      const pts  = t.pts  ?? t.points ?? '—';
      return `<tr>
        <td class="td-pos">${i + 1}</td>
        <td class="td-team">${bar}${escHtml(name)}</td>
        <td>${mp}</td><td>${w}</td><td>${d}</td><td>${l}</td>
        <td>${gd}</td>
        <td class="td-pts">${pts}</td>
      </tr>`;
    }).join('');
  }

  /* Standings toggle */
  const standingsWrap = document.getElementById('standings-wrap');
  document.getElementById('standings-toggle').addEventListener('click', () => {
    standingsWrap.classList.toggle('open');
    document.getElementById('standings-toggle')
      .setAttribute('aria-expanded', standingsWrap.classList.contains('open'));
  });
  document.getElementById('standings-toggle').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); standingsWrap.classList.toggle('open'); }
  });

  /* ══════════════════════════
     MOBILE MINI PLAYER
  ══════════════════════════ */
  const miniPlayer = document.getElementById('mini-player');

  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver(entries => {
      const { isIntersecting } = entries[0];
      miniPlayer.classList.toggle('show', !isIntersecting);
    }, { threshold: 0.15 });
    obs.observe(playerFrame);
  }

  document.getElementById('mini-back').addEventListener('click', () => {
    playerFrame.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ══════════════════════════
     POLLING
  ══════════════════════════ */
  /* Score refresh every 5s */
  setInterval(async () => {
    try {
      const r = await fetch(`${API}/api/live-config`);
      if (!r.ok) return;
      const cfg = await r.json();
      if (cfg.fifa?.raceData) updateMatchCard(cfg.fifa.raceData);
    } catch (_) {}
  }, 5000);

  /* Fixtures + standings refresh every 30s */
  setInterval(() => { fetchFixtures(); fetchStandings(); }, 30000);

  /* ══════════════════════════
     UTILITIES
  ══════════════════════════ */
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ══════════════════════════
     INIT
  ══════════════════════════ */
  /* Collapse standings on mobile by default */
  if (window.innerWidth < 768) {
    standingsWrap.classList.remove('open');
    document.getElementById('standings-toggle').setAttribute('aria-expanded', 'false');
  }

  fetchConfig();
  fetchFixtures();
  fetchStandings();

})();
</script>

</body>
</html>
